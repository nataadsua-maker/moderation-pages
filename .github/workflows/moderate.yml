name: moderate

on:
  repository_dispatch:
    types: [moderate]
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Submission ID to moderate (manual run)"
        required: true
      silent:
        description: "Silent re-run: refresh verdict, don't notify buyer (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: moderate-${{ github.event.client_payload.submission_id || inputs.submission_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record start time
        id: start
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: analyzer/requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r analyzer/requirements.txt

      - name: Resolve submission id
        id: sid
        run: |
          SID="${{ github.event.client_payload.submission_id }}"
          if [ -z "$SID" ]; then SID="${{ inputs.submission_id }}"; fi
          if [ -z "$SID" ]; then echo "no submission_id"; exit 1; fi
          echo "submission_id=$SID" >> $GITHUB_OUTPUT

      - name: Run analyzer
        id: analyzer
        timeout-minutes: 20
        env:
          SUBMISSION_ID: ${{ steps.sid.outputs.submission_id }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: moderation-videos
          GOOGLE_DRIVE_SA_JSON: ${{ secrets.GOOGLE_DRIVE_SA_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          SILENT: ${{ inputs.silent }}
        run: python -u analyzer/moderate.py --submission-id "$SUBMISSION_ID"

      # Анализатор завис/упал (в т.ч. таймаут 8 мин выше) и вердикт не отправил —
      # не оставляем заявку висеть, отправляем её модератору на ручную проверку.
      # Воркер идемпотентен: если вердикт уже пришёл, эндпоинт ничего не делает.
      - name: Report analysis failure to Worker
        if: failure()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          SID_PAYLOAD: ${{ github.event.client_payload.submission_id }}
          SID_INPUT: ${{ inputs.submission_id }}
        run: |
          SID="$SID_PAYLOAD"
          if [ -z "$SID" ]; then SID="$SID_INPUT"; fi
          if [ -z "$SID" ]; then echo "no submission id, skip"; exit 0; fi
          echo "Reporting analysis failure for $SID"
          curl -sS -X POST "${WORKER_URL}/api/internal/analysis-failed" \
            -H "Authorization: Bearer ${VERDICT_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"submission_id\": \"${SID}\"}" || true

      - name: Report GH Actions usage to Worker
        if: always()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          START_TS: ${{ steps.start.outputs.ts }}
        run: |
          DURATION_SEC=$(( $(date +%s) - START_TS ))
          DURATION_MIN=$(awk "BEGIN { printf \"%.2f\", $DURATION_SEC / 60 }")
          echo "Workflow took ${DURATION_MIN} min"
          curl -sS -X POST "${WORKER_URL}/api/internal/usage-report" \
            -H "Authorization: Bearer ${VERDICT_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"minutes\": ${DURATION_MIN}}" || true
