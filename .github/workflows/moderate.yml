name: moderate

on:
  repository_dispatch:
    types: [moderate]
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Submission ID to moderate (manual run)"
        required: true

permissions:
  contents: write

concurrency:
  group: moderate-${{ github.event.client_payload.submission_id || inputs.submission_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record start time
        id: start
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: analyzer/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r analyzer/requirements.txt

      - name: Resolve submission id
        id: sid
        run: |
          SID="${{ github.event.client_payload.submission_id }}"
          if [ -z "$SID" ]; then SID="${{ inputs.submission_id }}"; fi
          if [ -z "$SID" ]; then echo "no submission_id"; exit 1; fi
          echo "submission_id=$SID" >> $GITHUB_OUTPUT

      - name: Run analyzer
        id: analyzer
        env:
          SUBMISSION_ID: ${{ steps.sid.outputs.submission_id }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: moderation-videos
        run: python -u analyzer/moderate.py --submission-id "$SUBMISSION_ID"

      - name: Report GH Actions usage to Worker
        if: always()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          START_TS: ${{ steps.start.outputs.ts }}
        run: |
          DURATION_SEC=$(( $(date +%s) - START_TS ))
          DURATION_MIN=$(awk "BEGIN { printf \"%.2f\", $DURATION_SEC / 60 }")
          echo "Workflow took ${DURATION_MIN} min"
          curl -sS -X POST "${WORKER_URL}/api/internal/usage-report" \
            -H "Authorization: Bearer ${VERDICT_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"minutes\": ${DURATION_MIN}}" || true
