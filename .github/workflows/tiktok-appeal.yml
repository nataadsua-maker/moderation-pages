name: tiktok-appeal

# Апелляция на реджект TikTok Ads для вкладки «🎫 TikTok» сервиса модерации:
# объявление из TikTok API, сцены ролика, скрин ленда, текст EN+RU и PDF
# (analyzer/tiktok_appeal.py). Chrome для скрина и PDF уже есть на ubuntu-latest.

on:
  repository_dispatch:
    types: [tiktok_appeal]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: analyzer/requirements.txt

      - name: Install ffmpeg
        timeout-minutes: 6
        run: |
          # Статическая сборка с GitHub, как в airfind-media.yml (apt на раннерах тормозит).
          set -e
          URL=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          if curl -fsSL --retry 3 --retry-delay 5 --max-time 180 -o /tmp/ffmpeg.tar.xz "$URL"; then
            mkdir -p /tmp/ffmpeg
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
            sudo install -m 755 /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          else
            echo "static build unavailable, fallback to apt"
            export DEBIAN_FRONTEND=noninteractive
            timeout 240 sudo -E apt-get -o Acquire::Retries=3 update
            timeout 240 sudo -E apt-get -o Acquire::Retries=3 install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Python deps
        timeout-minutes: 5
        run: pip install -r analyzer/requirements.txt

      - name: Build appeal
        timeout-minutes: 12
        env:
          APPEAL_ID: ${{ github.event.client_payload.appeal_id }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_BUCKET: moderation-videos
        run: python -u analyzer/tiktok_appeal.py --appeal-id "$APPEAL_ID"

      - name: Report failure to Worker
        if: failure()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          VERDICT_SHARED_SECRET: ${{ secrets.VERDICT_SHARED_SECRET }}
          APPEAL_ID: ${{ github.event.client_payload.appeal_id }}
        run: |
          curl -sS -X POST "${WORKER_URL}/api/internal/tt-appeal" \
            -H "Authorization: Bearer ${VERDICT_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -d "{\"appeal_id\": \"${APPEAL_ID}\", \"ok\": false, \"error\": \"сборка упала, см. GitHub Actions\"}" || true
